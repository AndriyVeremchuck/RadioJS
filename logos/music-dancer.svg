<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background glowing gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#142145" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070b19" stop-opacity="1"/>
    </radialGradient>

    <!-- Ukrainian blue-to-gold aura gradient -->
    <linearGradient id="ukraineFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="35%" stop-color="#0057b8"/>
      <stop offset="65%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>

    <!-- Gold metallic for decorative notes -->
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e6a100"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" rx="28" fill="url(#bgGlow)"/>

  <!-- Subtle rhythmic wave staves behind dancer -->
  <g opacity="0.22" stroke="#00d2ff" stroke-width="1.8" fill="none">
    <path d="M 40 220 Q 200 170, 360 250 T 560 200" />
    <path d="M 40 240 Q 200 190, 360 270 T 560 220" />
    <path d="M 40 260 Q 200 210, 360 290 T 560 240" />
    <path d="M 40 280 Q 200 230, 360 310 T 560 260" />
    <path d="M 40 300 Q 200 250, 360 330 T 560 280" />
  </g>

  <!-- Musical Treble Clef fused with an elegant female dancer silhouette -->
  <g filter="url(#neonBloom)">
    <!-- Swirling dress trails & motion arcs (Treble Clef body) -->
    <path d="M 300 85 
             C 318 60, 355 75, 345 118 
             C 330 170, 275 240, 275 320 
             C 275 385, 320 420, 370 395 
             C 415 372, 435 315, 395 270 
             C 350 220, 260 255, 235 340 
             C 210 425, 260 520, 305 580 
             C 318 598, 318 630, 302 645 
             C 285 660, 260 650, 260 625 
             C 260 605, 280 595, 290 610" 
          fill="none" 
          stroke="url(#ukraineFlow)" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Main central spine / dancer's torso and poised leg -->
    <path d="M 315 95 
             C 315 150, 305 270, 305 450 
             C 305 530, 305 600, 290 635" 
          fill="none" 
          stroke="url(#ukraineFlow)" 
          stroke-width="14" 
          stroke-linecap="round"/>

    <!-- Dancer's Head, arched back & crown -->
    <circle cx="332" cy="98" r="14" fill="url(#goldGleam)" />
    
    <!-- Slender dancer waist & flowing arms in graceful ballet pose -->
    <path d="M 326 112 
             C 335 130, 350 155, 375 160 
             C 400 165, 420 145, 438 125" 
          fill="none" 
          stroke="url(#goldGleam)" 
          stroke-width="7" 
          stroke-linecap="round"/>

    <path d="M 320 120 
             C 300 135, 265 145, 245 130 
             C 230 118, 235 90, 252 80" 
          fill="none" 
          stroke="url(#ukraineFlow)" 
          stroke-width="6.5" 
          stroke-linecap="round"/>

    <!-- Dynamic swirling ballet dress fabric (lower spiral loop of G-clef) -->
    <path d="M 270 340 
             C 300 370, 350 380, 425 365 
             C 490 352, 515 390, 470 435 
             C 415 490, 320 495, 240 455 
             C 175 422, 160 345, 195 275 
             C 225 220, 285 200, 335 210" 
          fill="none" 
          stroke="url(#goldGleam)" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.9"/>

    <path d="M 285 460 
             C 330 520, 395 550, 460 525 
             C 500 510, 520 480, 505 450" 
          fill="none" 
          stroke="url(#ukraineFlow)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          opacity="0.75"/>
  </g>

  <!-- Sparkles & Floating Musical Notes around the dancer -->
  <g fill="url(#goldGleam)" filter="url(#softGlow)">
    <!-- Eighth note -->
    <path d="M 160 180 h 20 v 32 a 10 10 0 1 1 -8 -9 v -15 h -12 z"/>
    <!-- Sixteenth note pair -->
    <path d="M 445 220 h 26 v 30 a 8 8 0 1 1 -6 -7 v -17 h 26 v 30 a 8 8 0 1 1 -6 -7 v -23 z"/>
    <!-- Quarter note -->
    <path d="M 470 510 v 26 a 9 9 0 1 1 -7 -8 v -18 z"/>

    <!-- Magic star sparkles -->
    <polygon points="190,140 193,148 201,151 193,154 190,162 187,154 179,151 187,148" />
    <polygon points="420,80 422,86 428,88 422,90 420,96 418,90 412,88 418,86" />
    <polygon points="140,360 142,367 149,369 142,371 140,378 138,371 131,369 138,367" />
    <polygon points="490,320 492,327 499,329 492,331 490,338 488,331 481,329 488,327" />
    <polygon points="230,580 232,586 238,588 232,590 230,596 228,590 222,588 228,586" />
  </g>
</svg>
